{% extends "base.html" %}
{% set active_page = "login" %}

{% block title %}RailSecurix - Sign In{% endblock %}

{% block content %}
<div class="container-narrow" style="max-width: 480px; margin-top: 2rem;">
    <div class="card">
        <div class="card-header" style="text-align: center; display: block; border-bottom: none; padding-bottom: 0;">
            <div class="brand-badge" style="margin: 0 auto 0.75rem; width: 44px; height: 44px; font-size: 1.4rem;">R</div>
            <h1 class="card-title" style="font-size: 1.4rem;">Sign In to RailSecurix</h1>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">
                Enter your traveler or administrative credentials to access your account.
            </p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" id="loginForm" style="margin-top: 1.25rem;">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus placeholder="Enter your username">
            </div>

            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-railway" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
                Sign In &rarr;
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: var(--text-muted);">
            Don't have an account yet? <a href="{{ url_for('register') }}" style="color: var(--railway-blue); font-weight: 600;">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
